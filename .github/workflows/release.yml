name: Release

# Cross-platform source archive. One zip is the Lyra project source for
# Windows, Mac, Linux, Android, and iOS.
#
# Cooked player binaries are not built. They need Lyra Starter Game content
# from Fab, which this repository does not contain. Do not vendor that content
# and do not point a cook or package step at it from this workflow.
#
# Publish runs only for a v* tag push, or a dispatch with publish set, by
# someone who can write to this repository. The source job is GitHub-hosted
# and has no secrets. There is no self-hosted runner and no pull_request_target.
on:
  pull_request:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to archive (for example v0.0.0). Empty uses the Lyra demo plugin VersionName and does not publish."
        required: false
        default: ""
      publish:
        description: "Create or update the GitHub release for tag. Source archive only."
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  # The tag being released, or empty for a pull request or a dispatched dry run.
  RELEASE_TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
  # What the source job checks out: the dispatched tag, or the ref that triggered the run.
  RELEASE_REF: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}

jobs:
  source:
    name: Source archive
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_REF }}
          persist-credentials: false
      - name: Check the tag against the Lyra demo plugin VersionName
        id: version
        env:
          PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
        run: |
          set -euo pipefail
          if [ "$PUBLISH" = "true" ] && [ -z "$RELEASE_TAG" ]; then
            echo "::error::publishing needs a tag; dispatch with the tag input set"
            exit 1
          fi
          if [ -n "$RELEASE_TAG" ]; then
            version="$(python3 ci/release.py version --tag "$RELEASE_TAG")"
          else
            version="$(python3 ci/release.py version)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Release version $version (tag: ${RELEASE_TAG:-none, dry run})"
      - name: Release script tests
        run: python3 -m unittest discover -s ci -p 'test_release.py' -v
      - name: Build the cross-platform source zip
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          python3 ci/release.py source --version "$VERSION" --out dist
          python3 -m zipfile -l "dist/haiven-unreal-lyra-source-${VERSION}.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-source
          path: dist/haiven-unreal-lyra-source-*.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: source
    if: github.repository == 'haiven-dev/haiven-sdk-unreal-lyra' && (github.event_name == 'push' || inputs.publish)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-source
          path: dist
      - name: SHA256SUMS
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum -- *.zip > SHA256SUMS
          cat SHA256SUMS
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.source.outputs.version }}
        run: |
          set -euo pipefail
          notes="Source archive of haiven-sdk-unreal-lyra ${VERSION}. Platform-neutral project source for Windows, Mac, Linux, Android, and iOS. This release does not include Fab marketplace content or a cooked player binary."
          prerelease=()
          case "$VERSION" in *-*) prerelease=(--prerelease) ;; esac
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/*.zip dist/SHA256SUMS --clobber
          else
            gh release create "$RELEASE_TAG" dist/*.zip dist/SHA256SUMS \
              --verify-tag --title "Haiven Unreal Lyra source $VERSION" --notes "$notes" "${prerelease[@]}"
          fi
          gh release view "$RELEASE_TAG" --json assets -q '.assets[].name'
